# Blueprint do Render para o Observa AI.
# Cria: 1 Web Service (FastAPI + frontend compilado), 1 Postgres, 2 Cron Jobs.
# Os valores com `sync: false` são pedidos no painel na primeira criação do Blueprint.

databases:
  - name: observa-db
    databaseName: observa
    user: observa
    plan: basic-256mb        # o plano free do Postgres expira ao fim de 30 dias; ver README
    region: frankfurt

envVarGroups:
  - name: observa-shared
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: observa-db
          property: connectionString
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: MAX_LLM_CALLS_PER_DAY
        value: "200"
      - key: RELEVANCE_THRESHOLD
        value: "40"
      - key: ENABLE_X
        value: "false"
      - key: X_BEARER_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7

services:
  # ---------- Web Service: API + frontend ----------
  - type: web
    name: observa-ai
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: .
    buildCommand: >-
      pip install -r backend/requirements.txt &&
      cd frontend && npm ci && npm run build
    startCommand: >-
      cd backend && alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - fromGroup: observa-shared
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SECURE_COOKIES
        value: "true"
      - key: NODE_VERSION
        value: 20.18.0

  # ---------- Cron 1: ingestão + classificação (06:00 UTC = 06:00 Lisboa no inverno, 07:00 no verão) ----------
  - type: cron
    name: observa-ingest
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "0 6 * * *"
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && alembic upgrade head && python -m app.jobs ingest
    envVars:
      - fromGroup: observa-shared
      - key: IPMA_MIN_LEVEL
        value: orange

  # ---------- Cron 2: missões (a seguir à ingestão) ----------
  - type: cron
    name: observa-missions
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "0 7 * * *"
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m app.jobs missions
    envVars:
      - fromGroup: observa-shared
